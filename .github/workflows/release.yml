name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each platform only builds and hands its installers over as artifacts.
  # Publishing from inside the matrix races: three jobs each create their own
  # draft release for the same tag, and three parallel ~100 MB uploads time out.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install RPM tooling
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run lint && npm run typecheck && npm test

      - name: Build installers
        run: npm run build && npx electron-builder --publish never
        env:
          # Builds are unsigned. Set the signing secrets and drop this line to
          # ship notarized macOS artifacts from your own account.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          # Only what a person downloads. The .blockmap and latest*.yml files
          # are electron-updater metadata, and this app has no auto-updater.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  # One job, one release, one sequential upload.
  publish:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Collect installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: List what will be published
        run: ls -lh dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            dist/*
